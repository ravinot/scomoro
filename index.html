<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoMoro - The focus timer that doesn't hold a hose, mate.</title>
<script src="js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/scomoro-styles.css">
</head>
<body>

<div class="page">
  <div class="posts" aria-hidden="true"><span></span><span></span></div>
  <div class="card-wrap">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between light and dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path></svg>
    </button>
    <div class="card">
    <div class="eyebrow">Authorised by S. Morrison, Pomodoro Party of Australia</div>

    <div class="portrait-wrap">
      <img class="portrait" id="portraitImg" src="images/scomo-holiday.jpg" alt="Scott Morrison" width="630" height="630">
    </div>

    <h1 class="wordmark">ScoMoro</h1>
    <p class="tagline">The focus timer that doesn't hold a hose.</p>

    <div class="session-row">
      <span class="pill" id="sessionPill">FOCUS</span>
      <span class="session-count" id="sessionCount">ScoMoro #1</span>
    </div>

    <div class="timer-wrap">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="90"></circle>
        <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="timer-display" id="timerDisplay" role="timer" aria-live="off">25:00</div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="startPauseBtn" type="button">Get to work, mate</button>
      <button class="btn btn-ghost" id="resetBtn" type="button">Reset</button>
    </div>

    <div class="lengths">
      <div class="stepper" role="group" aria-labelledby="focusLabel">
        <label id="focusLabel">Focus, min</label>
        <div class="stepper-controls">
          <button class="step-btn" data-target="focus" data-dir="-1" aria-label="Decrease focus length" type="button">&minus;</button>
          <span id="focusVal" aria-live="polite" aria-atomic="true">25</span>
          <button class="step-btn" data-target="focus" data-dir="1" aria-label="Increase focus length" type="button">+</button>
        </div>
      </div>
      <div class="stepper" role="group" aria-labelledby="breakLabel">
        <label id="breakLabel">Break, min</label>
        <div class="stepper-controls">
          <button class="step-btn" data-target="break" data-dir="-1" aria-label="Decrease break length" type="button">&minus;</button>
          <span id="breakVal" aria-live="polite" aria-atomic="true">5</span>
          <button class="step-btn" data-target="break" data-dir="1" aria-label="Increase break length" type="button">+</button>
        </div>
      </div>
    </div>

    <div class="island-strip" aria-hidden="true">
      <img class="island-strip-img" src="images/palm-trees.png" alt="">
    </div>
    </div>
  </div>
  <p class="footer-note">Promises not legally binding. Terms and conditions apply.</p>
</div>

<script src="js/app.js"></script>
</body>
</html>
